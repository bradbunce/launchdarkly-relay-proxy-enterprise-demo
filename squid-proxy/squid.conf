# Squid HTTP/HTTPS Proxy Configuration
# Port: 3128
# Purpose: Controllable forward proxy for LaunchDarkly Relay Proxy
# Optimized for long-lived HTTPS streaming connections (SSE)

# Listen on port 3128
http_port 3128

# Allow access from Docker network
acl localnet src 172.18.0.0/16
http_access allow localnet

# Deny all other access
http_access deny all

# DNS nameservers
dns_nameservers 8.8.8.8 8.8.4.4

# Cache settings (minimal caching for proxy)
cache deny all

# Logging
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Timeouts optimized for long-lived streaming connections
# LaunchDarkly uses Server-Sent Events (SSE) which require persistent connections
# These connections can be idle for extended periods between updates
connect_timeout 30 seconds
read_timeout 86400 seconds
request_timeout 300 seconds
client_lifetime 86400 seconds
pconn_timeout 86400 seconds

# Forwarded headers
forwarded_for on
via on

# Allow CONNECT for HTTPS tunneling
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT SSL_ports

# Allow standard HTTP ports
acl Safe_ports port 80
acl Safe_ports port 443
http_access deny !Safe_ports

# Disable coredumps
coredump_dir /var/cache/squid
